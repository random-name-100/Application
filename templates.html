<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NET//TEMPLATES — Cyberpunk RED</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body[data-t=g]{--c:#00ff9c;--bg:#030a06;--dim:#00ff9c33;--hi:#00ff9c18}
body[data-t=r]{--c:#ff2a3d;--bg:#0b0305;--dim:#ff2a3d33;--hi:#ff2a3d18}
body{margin:0;min-height:100vh;font:14px/1.45 "Courier New",ui-monospace,Menlo,monospace;background:var(--bg);color:var(--c);transition:background .4s,color .4s;padding:14px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,#0000 0 2px,#0005 3px)}
main{max-width:860px;margin:0 auto}
h1{font-size:clamp(20px,5vw,32px);letter-spacing:.2em;margin:4px 0;text-shadow:2px 0 #f0f8,-2px 0 #0ff8;animation:gl 4s infinite}
h1 small{display:block;font-size:11px;letter-spacing:.35em;opacity:.7;text-shadow:none}
@keyframes gl{0%,92%,100%{transform:none}94%{transform:translateX(3px)}96%{transform:translateX(-3px) skewX(6deg)}}
h2{margin:0 0 10px;font-size:15px;letter-spacing:.25em}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
button{font:inherit;color:var(--c);background:var(--hi);border:1px solid var(--c);padding:8px 12px;cursor:pointer;letter-spacing:.08em;transition:.15s}
button:hover:not(:disabled),button.on{background:var(--c);color:var(--bg);box-shadow:0 0 14px var(--c)}
button:disabled{opacity:.3;cursor:default}
.panel{border:1px solid var(--c);background:#000a;box-shadow:0 0 18px var(--dim),inset 0 0 28px var(--dim);padding:14px;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px))}
.tpl{display:none}.tpl.show{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
canvas{width:100%;height:auto;display:block;border:1px solid var(--c);background:#000}
.gal{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.gal img{height:54px;border:1px solid var(--c)}
.hh{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media(max-width:620px){.hh{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.grid button{padding:12px 0;font-size:16px;text-align:center}
.grid button.ok{border-color:var(--c);box-shadow:0 0 10px var(--c);background:var(--dim)}
.grid button.used{opacity:.25}
.grid button:not(.ok):not(.used){opacity:.55;border-color:var(--dim)}
.slots{display:flex;gap:5px;margin:6px 0 12px}.slots span{flex:1;text-align:center;border:1px dashed var(--c);padding:6px 0;min-height:32px}
.seq{border-left:3px solid var(--dim);padding:2px 8px;margin:6px 0}.seq.done{border-color:var(--c);text-shadow:0 0 8px var(--c)}
.msg{margin-top:10px;font-size:16px;letter-spacing:.15em;min-height:24px}
.log{border:1px solid var(--dim);min-height:150px;padding:8px;margin-bottom:10px}.log div{display:flex;justify-content:space-between;padding:2px 0}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.disp{font-size:28px;letter-spacing:.5em;text-align:center;border:1px solid var(--c);padding:8px;margin-bottom:8px;min-height:52px}
footer{margin:16px 0 4px;font-size:11px;opacity:.6;text-align:center;letter-spacing:.1em}
</style>
</head>
<body data-t="g">
<main>
<h1>NET//ARCHIVES<small>CYBERPUNK RED · TEMPLATES DE TERMINAL</small></h1>
<nav id="nav"></nav>
<section class="tpl panel" id="cam1"></section>
<section class="tpl panel" id="cam2"></section>
<section class="tpl panel" id="hack"></section>
<section class="tpl panel" id="lock"></section>
<footer>CHAQUE ONGLET = UN TEMPLATE AUTONOME (SECTION + FONCTION JS) À REPRENDRE DANS VOS PAGES</footer>
</main>
<script>
const $=(s,e=document)=>e.querySelector(s),R=n=>Math.floor(Math.random()*n);
const TPL=[{id:"cam1",t:"g",l:"01 · CAM MATRIX"},{id:"cam2",t:"r",l:"02 · CAM ROUGE"},{id:"hack",t:"g",l:"03 · BREACH"},{id:"lock",t:"r",l:"04 · CRACK-LOCK"}];
const nav=$("#nav");
TPL.forEach(p=>{const b=document.createElement("button");b.textContent=p.l;b.onclick=()=>show(p.id);b.id="b-"+p.id;nav.append(b)});
function show(id){const p=TPL.find(x=>x.id===id);document.body.dataset.t=p.t;TPL.forEach(q=>{$("#"+q.id).classList.toggle("show",q.id===id);$("#b-"+q.id).classList.toggle("on",q.id===id)})}

/* ===== TEMPLATES 01 & 02 : CAMÉRA ===== */
function cam(root,o){
  root.innerHTML=`<h2>${o.title}</h2><canvas width="640" height="400"></canvas><div class="row"><button data-a="on">▶ ACTIVER</button><button data-a="mode">MODE : <b>NORMAL</b></button><button data-a="snap">◉ CAPTURE</button></div><div class="gal"></div>`;
  const cv=$("canvas",root),x=cv.getContext("2d"),v=document.createElement("video");
  v.muted=true;v.playsInline=true;
  let live=false,mode=0,t=0,msg="SIGNAL ABSENT — ACTIVER LA CAMÉRA";
  const modes=["NORMAL","NOCTURNE","ANALYSE"],
  fl=["grayscale(1) contrast(1.3)","grayscale(1) brightness(2) contrast(1.4)","grayscale(1) contrast(2.2) invert(1)"],
  tg=[...Array(3)].map(()=>({x:R(500),y:R(300),vx:Math.random()*2-1,vy:Math.random()*2-1,id:10+R(90),p:55+R(40)}));
  root.onclick=e=>{const a=e.target.closest("button")?.dataset.a;if(!a)return;
    if(a==="on")navigator.mediaDevices?.getUserMedia({video:{facingMode:"environment"}}).then(s=>{v.srcObject=s;v.play();live=true}).catch(()=>{msg="ACCÈS CAMÉRA REFUSÉ — MODE SIMULATION"});
    if(a==="mode"){mode=(mode+1)%3;$("b",e.target.closest("button")).textContent=modes[mode]}
    if(a==="snap"){const i=new Image();i.src=cv.toDataURL("image/png");$(".gal",root).prepend(i)}};
  function br(px,py,sx,sy,l){x.beginPath();x.moveTo(px,py+sy*l);x.lineTo(px,py);x.lineTo(px+sx*l,py);x.stroke()}
  (function f(){
    if(!root.offsetParent){requestAnimationFrame(f);return}
    t++;x.globalCompositeOperation="source-over";
    if(live&&v.videoWidth){x.filter=fl[mode];x.drawImage(v,0,0,640,400);x.filter="none";x.globalCompositeOperation="multiply";x.fillStyle=o.tint;x.fillRect(0,0,640,400);x.globalCompositeOperation="source-over"}
    else{x.fillStyle="#000";x.fillRect(0,0,640,400);x.fillStyle=o.col;
      for(let i=0;i<260;i++){x.globalAlpha=Math.random()*.45;x.fillRect(R(640),R(400),R(40)+2,2)}
      x.globalAlpha=1;x.font="16px monospace";x.textAlign="center";x.fillText(msg,320,205);x.textAlign="left"}
    x.strokeStyle=x.fillStyle=o.col;x.lineWidth=2;x.font="13px monospace";
    br(14,14,1,1,34);br(626,14,-1,1,34);br(14,386,1,-1,34);br(626,386,-1,-1,34);
    x.beginPath();x.arc(320,200,42,0,7);x.moveTo(320,140);x.lineTo(320,170);x.moveTo(320,230);x.lineTo(320,260);x.moveTo(260,200);x.lineTo(290,200);x.moveTo(350,200);x.lineTo(380,200);x.stroke();
    if(mode===2)tg.forEach(g=>{g.x+=g.vx;g.y+=g.vy;if(g.x<30||g.x>520)g.vx*=-1;if(g.y<40||g.y>290)g.vy*=-1;
      x.strokeRect(g.x,g.y,70,90);x.fillText(`${o.lock} ${g.id} · ${g.p}%`,g.x,g.y-5)});
    if(live&&t%60<38)x.fillText("● REC",34,34);else if(!live)x.fillText("○ STBY",34,34);
    x.textAlign="right";x.fillText(new Date().toLocaleTimeString("fr-FR"),606,34);
    x.fillText("BAT 87% · SIG ▮▮▮▯",606,376);x.textAlign="left";
    x.fillText(`${o.tag} · ${modes[mode]}`,34,376);
    x.globalAlpha=.14;x.fillRect(0,(t*3)%400,640,4);x.globalAlpha=1;
    requestAnimationFrame(f)})();
}
cam($("#cam1"),{title:"AGENTVIEW // OPTIQUE MATRIX",col:"#00ff9c",tint:"#5dffb4",tag:"CAM-01 NETWATCH",lock:"CIBLE"});
cam($("#cam2"),{title:"BRAINDANCE // CAM ÈRE DU ROUGE",col:"#ff2a3d",tint:"#ff6672",tag:"CAM-02 NIGHT CITY",lock:"HOSTILE"});

/* ===== TEMPLATE 03 : BREACH PROTOCOL ===== */
(function(root){
  root.innerHTML=`<h2>BREACH PROTOCOL // PIRATAGE</h2><div class="hh"><div><div class="grid"></div></div><div><div>TAMPON</div><div class="slots"></div><div>SÉQUENCES CIBLES</div><div class="seqs"></div><div class="msg"></div><div class="row"><button class="rs">↻ NOUVELLE CONNEXION</button></div></div></div>`;
  const N=5,H=["1C","55","BD","E9","7A","FF"],G=$(".grid",root);
  let g,seqs,buf,step,last,used,t,iv,over;
  const has=(s)=>buf.some((_,i)=>s.every((h,j)=>buf[i+j]===h));
  function start(){
    clearInterval(iv);g=Array.from({length:N},()=>Array.from({length:N},()=>H[R(6)]));
    let r=0,c=R(N),p=[[r,c]];
    for(let i=1;i<5;i++){let n;if(i%2){do n=R(N);while(p.some(q=>q[0]===n&&q[1]===c));r=n}else{do n=R(N);while(p.some(q=>q[0]===r&&q[1]===n));c=n}p.push([r,c])}
    const cd=p.map(q=>g[q[0]][q[1]]);
    seqs=[{n:"DATAMINE_V1",s:cd.slice(0,3),ok:false},{n:"ICE_BREAKER",s:cd.slice(1,5),ok:false}];
    buf=[];step=0;last=[0,0];used=new Set();t=30;over=false;
    iv=setInterval(()=>{if(!over&&--t<=0)end();draw()},1000);draw()}
  function end(){over=true;clearInterval(iv)}
  const can=(r,c)=>!over&&!used.has(r+","+c)&&(step%2?c===last[1]:r===last[0]);
  G.onclick=e=>{const b=e.target.closest("button");if(!b)return;const r=+b.dataset.r,c=+b.dataset.c;if(!can(r,c))return;
    buf.push(g[r][c]);used.add(r+","+c);last=[r,c];step++;
    seqs.forEach(q=>{if(!q.ok&&has(q.s))q.ok=true});
    if(buf.length>=6||seqs.every(q=>q.ok))end();draw()};
  function draw(){
    G.innerHTML=g.map((row,r)=>row.map((h,c)=>`<button data-r="${r}" data-c="${c}" class="${used.has(r+","+c)?"used":can(r,c)?"ok":""}">${h}</button>`).join("")).join("");
    $(".slots",root).innerHTML=Array.from({length:6},(_,i)=>`<span>${buf[i]||"··"}</span>`).join("");
    $(".seqs",root).innerHTML=seqs.map(q=>`<div class="seq ${q.ok?"done":""}">${q.s.join(" ")}<br><small>${q.n} ${q.ok?"— ACCOMPLI":""}</small></div>`).join("");
    const k=seqs.filter(q=>q.ok).length;
    $(".msg",root).textContent=over?(k===2?"▓ BRÈCHE RÉUSSIE":k?"▒ BRÈCHE PARTIELLE":"░ ÉCHEC — ICE ACTIVÉE"):`⏱ ${t}s`}
  $(".rs",root).onclick=start;start();
})($("#hack"));

/* ===== TEMPLATE 04 : CRACK-LOCK (code à 4 chiffres) ===== */
(function(root){
  root.innerHTML=`<h2>CRACK-LOCK // SERRURE ÉLECTRONIQUE</h2><div class="hh"><div><div class="log"></div></div><div><div class="disp"></div><div class="kp"></div><div class="msg"></div><div class="row"><button class="rs">↻ NOUVELLE SERRURE</button></div></div></div>
  <div style="margin-top:10px;font-size:12px;opacity:.7">■ = bon chiffre, bien placé &nbsp; □ = bon chiffre, mal placé &nbsp; · 8 essais</div>`;
  let code,cur,tries,over;
  const kp=$(".kp",root);
  kp.innerHTML=[..."0123456789"].map(d=>`<button>${d}</button>`).join("")+`<button>⌫</button><button>OK</button>`;
  function start(){code=Array.from({length:4},()=>R(10)+"");cur="";tries=[];over=false;draw()}
  function fb(g){let b=0,w=0;const a=[],c=[];g.split("").forEach((d,i)=>d===code[i]?b++:(a.push(d),c.push(code[i])));a.forEach(d=>{const i=c.indexOf(d);if(i>-1){w++;c.splice(i,1)}});return[b,w]}
  function press(k){if(over)return;
    if(k==="⌫")cur=cur.slice(0,-1);
    else if(k==="OK"){if(cur.length<4)return;const[b,w]=fb(cur);tries.push([cur,b,w]);if(b===4||tries.length>=8)over=true;cur=""}
    else if(cur.length<4)cur+=k;
    draw()}
  kp.onclick=e=>{const b=e.target.closest("button");if(b)press(b.textContent)};
  document.addEventListener("keydown",e=>{if(!root.offsetParent)return;if(/^\d$/.test(e.key)||e.key==="Enter"||e.key==="Backspace")press(e.key==="Enter"?"OK":e.key==="Backspace"?"⌫":e.key)});
  function draw(){
    $(".log",root).innerHTML=tries.map(([g,b,w])=>`<div><span>${g.split("").join(" ")}</span><span>${"■".repeat(b)}${"□".repeat(w)}</span></div>`).join("")||"<div>— EN ATTENTE DE SAISIE —</div>";
    $(".disp",root).textContent=(cur+"····").slice(0,4);
    const win=tries.length&&tries[tries.length-1][1]===4;
    $(".msg",root).textContent=over?(win?"▓ SERRURE OUVERTE":"░ VERROUILLAGE — CODE : "+code.join("")):`ESSAIS RESTANTS : ${8-tries.length}`}
  $(".rs",root).onclick=start;start();
})($("#lock"));

show("cam1");
</script>
</body>
</html>

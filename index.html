{id:1,titre:"Carnage à la Calavera",resume:"La brute, des flingues et Juan",
 /* histoire = texte de l'onglet RÉSUMÉ (paragraphes séparés par une ligne vide, _texte_ = italique) */
 histoire:`Dans l'ombre suffocante d'un bâtiment désaffecté du sud-est du centre-ville, la justice de Night City prend une tournure brutale sous les mains d'Adam, le justicier, et de Glitch, le netrunner. Les deux flics n'hésitent pas à torturer un membre du gang des Metal Head, attaché nu sur une chaise poisseuse, pour lui extorquer la position de son boss, le redoutable Rancor. Crachant le morceau dans la douleur, le gangster avoue que sa cible se dirige vers le bar de la Calavera, situé dans le quartier malfamé de l'Oruga. Loin d'en avoir fini avec leur prisonnier, les deux agents le ligotent solidement avec une corde et le traînent sans ménagement dans leur sillage vers le bar.

Pendant ce temps, l'atmosphère est toute autre à l'intérieur de la Calavera où Choura, le techie, et Shiro, le medtech, s'imprègnent de l'ambiance du quartier de l'Oruga. Leur objectif est d'entrer en contact avec le fixer Saul pour décrocher un contrat crucial : récupérer du matériel de survie destiné aux quartiers de banlieue surpeuplés du sud-est. Après quelques mots échangés avec Juan, le barman et compagnon intime de Saul, les affaires sérieuses commencent enfin avec le fixer pour négocier un partenariat lucratif.

Les tractations tournent court lorsque l'imposant Rancor et trois de ses sbires font irruption dans l'établissement, déclenchant instantanément une violente rixe générale. D'abord acculés par la puissance de feu du gang, Choura, Shiro et Saul voient la situation basculer in extremis avec l'irruption fracassante d'Adam et Glitch qui exécutent froidement deux des hommes de main. Le chaos s'empare de la pièce, et dans la pluie de balles, Saul s'effondre, gravement touché à l'abdomen avec un poumon affaissé. Le combat atteint son paroxysme de brutalité contre le colosse Rancor, qui finit par s'effondrer, criblé de coups et achevé dans un tumulte assourdissant de cris, de poussière et de fumées âcres de grenades.

Alors que le silence retombe pesamment sur le bar dévasté et que Shiro se précipite pour stabiliser les blessures critiques de Saul, une terrible réalité s'impose au reste du groupe. Profitant de la confusion totale de l'affrontement pyrotechnique, le prisonnier des Metal Head a réussi à faire glisser sa corde et s'est volatilisé dans les rues sombres de Night City, non sans avoir arraché et kidnappé Juan au passage.`,

{id:2,titre:"Sang, Sueur et Ombres Corporatistes",resume:"La traque, la baston et la planque",
 histoire:`Tandis que Shiro parvient à stabiliser in extremis les blessures critiques de Saul dans les décombres de la Calavera, l'enquête reprend sans attendre pour retrouver Juan et son ravisseur. En interrogeant le central, Adam identifie le _Smasher_, un rade malfamé qui compte les Metal Heads comme habitués. Sur place, le groupe déniche un moyen d'obtenir des renseignements cruciaux : infiltrer une arnaque aux paris clandestins lors d'un tournoi de combat à mains nues. Envoyé dans l'arène, Choura traverse les deux premiers rounds truqués avec aisance, avant d'affronter une finale brutale et bien réelle. Le techie devient insaisissable, esquivant chaque tentative de projection de son adversaire pour finalement le briser grâce à des contres chirurgicaux. Le groupe rafle l'argent des paris et localise trois planques du gang : l'usine Alpha de Watson, la clinique Beta de Pacifica, et le hangar Gamma sur les docks.

Ciblant le point de transfert, l'équipe débarque devant un complexe délabré, vestige d'un centre de traitement des eaux ceinturé de grillages défoncés et crachant un fluide verdâtre dans la marina. Délaissant le toit lourdement défendu par des tourelles, ils s'infiltrent silencieusement par une porte de garage éventrée. À l'intérieur, Glitch se connecte au réseau local, aveugle les caméras et désamorce les défenses pour guider ses partenaires. Progressant sans éveiller les soupçons, ils atteignent l'étage supérieur, neutralisent le netrunner ennemi distrait par sa réalité virtuelle, et mettent à sac l'armurerie de feu Rancor. C'est là qu'ils retrouvent et assomment sauvagement le ravisseur de Juan, savourant leur vengeance.

L'accès au sous-sol enfin déverrouillé, l'escouade plonge dans l'abîme. Ils libèrent Juan en interrompant sa séance de torture et survivent par miracle à l'embuscade toxique d'un chimiste du gang grâce à des réflexes surhumains. L'horreur les attend plus loin : une immense cage remplie de cobayes humains malingres. La découverte glaçante du cadavre d'un enfant ébranle profondément l'humanité de deux membres du groupe. En fouillant les données numériques du repaire, l'ampleur de l'opération se dévoile : un trafic d'êtres humains massivement financé par l'obscure _BY Corp_. Le choc devient intime lorsque Choura découvre que sa propre sœur, Lisa Fiodorovitch Ouvarov, a été expédiée via ce réseau sur commande spéciale. L'intervention s'achève dans le vacarme des gyrophares lorsque le sauvetage d'un corpo captif déclenche sa puce d'alerte, attirant instantanément la Trauma Team et le NCPD qui sécurisent le périmètre et démantèlent ce qu'il reste des Metal Heads.`,

const FIREBASE={apiKey:"AIzaSyBGeJ5Bv00E2W0wj0LeyYZzrGId5GTz4p4",authDomain:"beyond-human-campaign.firebaseapp.com",projectId:"beyond-human-campaign",

/* Documents de jeu partagés (application TRACK…) : SYNC.watch(col,id,cb) → désabonnement ; SYNC.put(col,id,data).
   Par défaut : stockage local (cet appareil seulement), remplacé par Firebase ou claude.ai quand ils répondent. */
{const L={},key=(c,i)=>"nr:doc:"+c+"/"+i,read=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
 addEventListener("storage",e=>{(L[e.key]||[]).forEach(f=>f(read(e.key)))});
 Object.assign(SYNC,{watch:(c,i,cb)=>{const k=key(c,i);(L[k]||(L[k]=[])).push(cb);setTimeout(()=>cb(read(k)),0);return()=>{L[k]=L[k].filter(f=>f!==cb)}},
   put:async(c,i,d)=>{const k=key(c,i);try{localStorage.setItem(k,JSON.stringify(d))}catch(e){}(L[k]||[]).forEach(f=>f(JSON.parse(JSON.stringify(d))))}})}

function applySnap(list){
  for(const k in DONE)delete DONE[k];

const timeout=(p,ms)=>Promise.race([p,new Promise((_,ko)=>setTimeout(()=>ko(new Error("timeout")),ms))]);
async function initFirebase(){
  const [A,F,U]=await Promise.all(["app","firestore","auth"].map(m=>import(FBU+"firebase-"+m+".js")));
  const app=A.initializeApp(FIREBASE),db=F.getFirestore(app),auth=U.getAuth(app);
  await new Promise((ok,ko)=>{let first=true;
    F.onSnapshot(F.collection(db,"sessions"),snap=>{if(SYNC.kind==="claude")return;applySnap(snap.docs.map(d=>[d.id,d.data()]));if(first){first=false;ok()}},
      e=>{if(first){first=false;ko(e)}})});
  Object.assign(SYNC,{kind:"firebase",
    set:(s,v)=>F.setDoc(F.doc(db,"sessions","s"+s.id),{terminee:v,maj:Date.now()}),
    login:(e,pw)=>U.signInWithEmailAndPassword(auth,e,pw),logout:()=>U.signOut(auth),
    watch:(c,i,cb)=>F.onSnapshot(F.doc(db,c,i),d=>cb(d.exists()?d.data():null),e=>{console.warn("lecture",c,i,e.code);cb(null,e)}),
    put:(c,i,d)=>F.setDoc(F.doc(db,c,i),d)});
  /* le MJ se connecte par e-mail ; les joueurs reçoivent une connexion anonyme (pour écrire leurs ordres) */
  U.onAuthStateChanged(auth,u=>{SYNC.user=u&&!u.isAnonymous?u:null;SYNC.canWrite=!!SYNC.user;SYNC.anon=!!(u&&u.isAnonymous);
    if(!u)U.signInAnonymously(auth).catch(e=>console.warn("connexion anonyme indisponible :",e.code));refresh()})}
async function initClaude(){
  if(!window.claude?.use)throw new Error("no claude");
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db)throw new Error("no db");
  const owner=user?await user.isOwner():false;
  Object.assign(SYNC,{kind:"claude",canWrite:owner,set:(s,v)=>db.collection("sessions").doc("s"+s.id).set({terminee:v,maj:Date.now()}),
    watch:(c,i,cb)=>db.doc(c+"/"+i).onSnapshot(d=>cb(d.exists?d.data():null),e=>cb(null,e)),put:(c,i,d)=>db.doc(c+"/"+i).set(d)});
  db.collection("sessions").onSnapshot(snap=>applySnap(snap.docs.map(d=>[d.id,d.data()])),()=>{});
  refresh()}
(async()=>{
  try{await timeout(initFirebase(),10000)}
  catch(e){console.warn("Firebase indisponible :",e&&(e.code||e.message));try{await initClaude()}catch(e2){refresh()}}

  v.muted=true;v.playsInline=true;

  const modes=["NORMAL","NOCTURNE","ANALYSE"],fl=["grayscale(1) contrast(1.3)","grayscale(1) brightness(2) contrast(1.4)","grayscale(1) contrast(2.2) invert(1)"],
  tg=[...Array(3)].map(()=>({x:R(500),y:R(300),vx:Math.random()*2-1,vy:Math.random()*2-1,id:10+R(90),p:55+R(40)}));

    if(a==="mode"){mode=(mode+1)%3;$("b",b).textContent=modes[mode]}

      if(h<0)M.textContent="CAPTURE ENREGISTRÉE — AUCUNE DONNÉE EXPLOITABLE";else{M.textContent="▓ DONNÉE EXTRAITE";reveal(app,[h])}}};
  function br(px,py,sx,sy,l){x.beginPath();x.moveTo(px,py+sy*l);x.lineTo(px,py);x.lineTo(px+sx*l,py);x.stroke()}
  (function f(){
    if(!root.isConnected){stream&&stream.getTracks().forEach(k=>k.stop());return}
    t++;x.globalCompositeOperation="source-over";
    if(live&&v.videoWidth){x.filter=fl[mode];x.drawImage(v,0,0,640,400);x.filter="none";x.globalCompositeOperation="multiply";x.fillStyle="#5dffb4";x.fillRect(0,0,640,400);x.globalCompositeOperation="source-over"}
    else{x.fillStyle="#000";x.fillRect(0,0,640,400);x.fillStyle=C;for(let i=0;i<260;i++){x.globalAlpha=Math.random()*.45;x.fillRect(R(640),R(400),R(40)+2,2)}
      x.globalAlpha=1;x.font="16px monospace";x.textAlign="center";x.fillText(msg,320,205);x.textAlign="left"}
    x.strokeStyle=x.fillStyle=C;x.lineWidth=2;x.font="13px monospace";
    br(14,14,1,1,34);br(626,14,-1,1,34);br(14,386,1,-1,34);br(626,386,-1,-1,34);
    x.beginPath();x.arc(320,200,42,0,7);x.moveTo(320,140);x.lineTo(320,170);x.moveTo(320,230);x.lineTo(320,260);x.moveTo(260,200);x.lineTo(290,200);x.moveTo(350,200);x.lineTo(380,200);x.stroke();
    if(mode===2)tg.forEach(g=>{g.x+=g.vx;g.y+=g.vy;if(g.x<30||g.x>520)g.vx*=-1;if(g.y<40||g.y>290)g.vy*=-1;x.strokeRect(g.x,g.y,70,90);x.fillText(`CIBLE ${g.id} · ${g.p}%`,g.x,g.y-5)});
    if(live&&t%60<38)x.fillText("● REC",34,34);else if(!live)x.fillText("○ STBY",34,34);
    x.textAlign="right";x.fillText(new Date().toLocaleTimeString("fr-FR"),606,34);x.textAlign="left";
    x.fillText(`${app.tag} · ${modes[mode]}`,34,376);
    x.globalAlpha=.14;x.fillRect(0,(t*3)%400,640,4);x.globalAlpha=1;requestAnimationFrame(f)})()};

/* ============ APP : BREACH PROTOCOL ============ */
RUN.breach=(root,app)=>{
  root.innerHTML=`<h2>${esc(app.nom)}</h2><div class="hh"><div class="grid"></div><div><div>TAMPON</div><div class="slots"></div><div>FICHIERS CHIFFRÉS</div><div class="seqs"></div><div class="msg"></div><div class="row"><button class="rs">↻ RECOMMENCER</button></div></div></div>`;
  const N=5,H=["1C","55","BD","E9","7A","FF"],G=$(".grid",root);
  let g,seqs,buf,step,last,used,t,iv,over;
  const has=s=>buf.some((_,i)=>s.every((h,j)=>buf[i+j]===h));
  function end(){over=true;clearInterval(iv)}
  function start(){
    clearInterval(iv);g=Array.from({length:N},()=>Array.from({length:N},()=>H[R(6)]));
    let r=0,c=R(N),p=[[r,c]];
    for(let i=1;i<5;i++){let n;if(i%2){do n=R(N);while(p.some(q=>q[0]===n&&q[1]===c));r=n}else{do n=R(N);while(p.some(q=>q[0]===r&&q[1]===n));c=n}p.push([r,c])}
    const cd=p.map(q=>g[q[0]][q[1]]);
    seqs=[{s:cd.slice(0,3),ok:false},{s:cd.slice(1,5),ok:false}];
    buf=[];step=0;last=[0,0];used=new Set();t=app.time||30;over=false;
    iv=setInterval(()=>{if(!root.isConnected){clearInterval(iv);return}if(!over&&--t<=0)end();draw()},1000);draw()}
  const can=(r,c)=>!over&&!used.has(r+","+c)&&(step%2?c===last[1]:r===last[0]);
  G.onclick=e=>{const b=e.target.closest("button");if(!b)return;const r=+b.dataset.r,c=+b.dataset.c;if(!can(r,c))return;
    buf.push(g[r][c]);used.add(r+","+c);last=[r,c];step++;
    const done=[];seqs.forEach((q,i)=>{if(!q.ok&&has(q.s)){q.ok=true;done.push(i)}});
    if(buf.length>=6||seqs.every(q=>q.ok))end();draw();if(done.length)reveal(app,done.filter(i=>app.files[i]))};
  function draw(){
    G.innerHTML=g.map((row,r)=>row.map((h,c)=>`<button data-r="${r}" data-c="${c}" class="${used.has(r+","+c)?"used":can(r,c)?"ok":""}">${h}</button>`).join("")).join("");
    $(".slots",root).innerHTML=Array.from({length:6},(_,i)=>`<span>${buf[i]||"··"}</span>`).join("");
    $(".seqs",root).innerHTML=seqs.map((q,i)=>`<div class="seq ${q.ok?"done":""}">${q.s.join(" ")}<br><small>${q.ok&&app.files[i]?esc(app.files[i].titre):"▒▒▒ FICHIER CHIFFRÉ "+(i+1)}</small></div>`).join("");
    const k=seqs.filter(q=>q.ok).length;
    $(".msg",root).textContent=over?(k===2?"▓ BRÈCHE RÉUSSIE":k?"▒ BRÈCHE PARTIELLE":"░ ÉCHEC — ICE ACTIVÉE"):`⏱ ${t}s`}
  $(".rs",root).onclick=start;start()};

/* ============ APP : CRACK-LOCK ============ */
RUN.lock=(root,app)=>{
  const L=app.secret.length,T=app.tries||8;
  root.innerHTML=`<h2>${esc(app.nom)}</h2><div class="hh"><div class="log"></div><div><div class="disp"></div><div class="kp"></div><div class="msg"></div></div></div><small>■ = bon chiffre bien placé · □ = bon chiffre mal placé · ${T} essais</small>`;
  let cur="",tries=[],over=false;const kp=$(".kp",root);
  kp.innerHTML=[..."0123456789"].map(d=>`<button>${d}</button>`).join("")+`<button>⌫</button><button>OK</button>`;
  const fb=gs=>{let b=0,w=0;const a=[],c=[];gs.split("").forEach((d,i)=>d===app.secret[i]?b++:(a.push(d),c.push(app.secret[i])));a.forEach(d=>{const i=c.indexOf(d);if(i>-1){w++;c.splice(i,1)}});return[b,w]};
  function press(k){if(over)return;
    if(k==="⌫")cur=cur.slice(0,-1);
    else if(k==="OK"){if(cur.length<L)return;const[b,w]=fb(cur);tries.push([cur,b,w]);if(b===L||tries.length>=T)over=true;cur="";
      if(b===L){draw();reveal(app,app.files.map((_,i)=>i));return}}
    else if(cur.length<L)cur+=k;
    draw()}
  kp.onclick=e=>{const b=e.target.closest("button");if(b)press(b.textContent)};
  const kd=e=>{if(!root.isConnected){removeEventListener("keydown",kd);return}if(/^\d$/.test(e.key)||e.key==="Enter"||e.key==="Backspace")press(e.key==="Enter"?"OK":e.key==="Backspace"?"⌫":e.key)};
  addEventListener("keydown",kd);
  function draw(){
    $(".log",root).innerHTML=tries.map(([g,b,w])=>`<div><span>${g.split("").join(" ")}</span><span>${"■".repeat(b)}${"□".repeat(w)}</span></div>`).join("")||"<div>— EN ATTENTE DE SAISIE —</div>";
    $(".disp",root).textContent=(cur+"·".repeat(L)).slice(0,L);
    const win=tries.length&&tries[tries.length-1][1]===L;
    $(".msg",root).textContent=over?(win?"▓ SERRURE OUVERTE":"░ VERROUILLAGE"):`ESSAIS RESTANTS : ${T-tries.length}`}
  draw()};

/* ============ APP : TRACK (poursuite au tour par tour sur le plan complet) ============
   Documents partagés :  traque/<id>        état public (tour, positions des traqueurs, police si visible, journal)
                         traque/<id>-t1|t2   ordres des traqueurs (cachés à l'écran du MJ jusqu'à la résolution)
                         traquemj/<id>       police : position et ordres (lisibles par le MJ seulement)
   Ordres : une liste de choix aux carrefours (⬆ tout droit, ⬅ gauche, ➡ droite, ↩ demi-tour), au plus vmax par tour.
   Résolution (MJ) : tous les déplacements sont appliqués en même temps, interceptions détectées. */
RUN.track=(root,app)=>{
  const M=window.NC_CARTE;if(!M||!M.buildGraph){root.innerHTML="<p>CARTE INDISPONIBLE.</p>";return}
  document.body.classList.add("wide");
  const ID=app.id,V=app.voitures,CARS=["t1","t2","police"],ICON={S:"⬆",L:"⬅",R:"➡",U:"↩"},LIB={S:"TOUT DROIT",L:"GAUCHE",R:"DROITE",U:"DEMI-TOUR"};
  const RK="nr:track-role:"+ID;let role=(()=>{try{return localStorage.getItem(RK)||""}catch(e){return""}})(),localMJ=false;
  let pub=null,priv=null,ord={t1:null,t2:null},draft=[],placing=null,anim=null,animTour=0,unsubs=[],privSub=null,msg="",busy=false;
  const isMJ=()=>SYNC.kind==="firebase"?!!SYNC.user:SYNC.kind==="claude"?!!SYNC.canWrite:(localMJ||mjOk);
  const P=k=>{const n=M.buildGraph().N[k];return n?n.p:null},nm=k=>M.interName(k)||"carrefour";
  root.innerHTML=`<div class="tk"><div class="tk-map"></div><div class="tk-side"><h2 style="margin:0 0 6px">${esc(app.nom)}</h2><div class="tk-body"><p>CONNEXION…</p></div></div></div>`;
  const side=$(".tk-body",root);
  /* ---- carte ---- */
  const home0=()=>{const pts=["t1","t2","police"].map(c=>carOf(c)).filter(Boolean).map(c=>P(c.n)).filter(Boolean);
    if(!pts.length)return null;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return[Math.min(...xs)-450,Math.min(...ys)-350,Math.max(...xs)+450,Math.max(...ys)+350]};
  const map=M.mountMap($(".tk-map",root),{onTap,onScale:()=>draw()});
  /* ---- état ---- */
  function carOf(c){if(c==="police")return isMJ()&&priv?priv.police:pub&&pub.cars.police;return pub&&pub.cars[c]}
  const vmaxOf=c=>(c==="police"&&isMJ()&&priv?priv.vmax:pub&&pub.vmax&&pub.vmax[c])||V[c].vmax;
  const myCar=()=>role==="mj"?"police":role;
  const ready=c=>c==="police"?!!pub&&pub.policeOk===pub.tour:!!ord[c]&&!!pub&&ord[c].tour===pub.tour;
  function defaults(){const cars={};CARS.forEach(c=>{const n=M.nearestInter(M.C(V[c].dep));cars[c]={n:n.k,f:[...n.adj.keys()][0]}});
    return{pub:{tour:1,cars:{t1:cars.t1,t2:cars.t2,police:cars.police},vmax:{t1:V.t1.vmax,t2:V.t2.vmax},policeOk:0,cacher:false,log:[{t:0,txt:"Nouvelle traque. Le MJ place les véhicules, puis chacun donne ses ordres."}],last:{tour:0,paths:{}},maj:Date.now()},
      priv:{police:cars.police,vmax:V.police.vmax,ordres:[],tour:0}}}
  const fail=e=>{busy=false;const c=e&&e.code||e&&e.message||"erreur";msg=/permission|denied|not_found|invalid_argument/i.test(c)?
      "░ ÉCRITURE REFUSÉE ("+c+"). "+(SYNC.kind==="firebase"?"Vérifier la connexion anonyme et les règles Firestore (traque / traquemj).":"Droits insuffisants sur cette page."):"░ ÉCHEC : "+c;render()};
  const putPub=d=>SYNC.put("traque",ID,{...d,maj:Date.now()}),putPriv=d=>SYNC.put("traquemj",ID,d);
  /* ---- abonnements ---- */
  function subPriv(){if(privSub||!isMJ())return;privSub=SYNC.watch("traquemj",ID,d=>{if(!alive())return;priv=d;draw();render()});unsubs.push(()=>privSub&&privSub())}
  const alive=()=>{if(root.isConnected)return true;unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];return false};
  SYNC.ready.then(()=>{if(!alive())return;
    unsubs.push(SYNC.watch("traque",ID,d=>{if(!alive())return;const first=!pub;pub=d;
      if(!d&&isMJ()){const D=defaults();putPriv(D.priv).then(()=>putPub(D.pub)).catch(fail);return}
      if(d&&d.last&&d.last.tour===d.tour&&animTour&&animTour<d.tour)startAnim(d.last.paths);
      if(d)animTour=d.tour;if(d&&d.tour!==draftTour){draft=[];draftTour=d.tour}
      if(first&&d){const h=home0();if(h){map.setHome(h);map.z.fit();map.lod()}}
      draw();render()}));
    ["t1","t2"].forEach(c=>unsubs.push(SYNC.watch("traque",ID+"-"+c,d=>{if(!alive())return;ord[c]=d;if(d&&pub&&d.tour===pub.tour&&role===c&&!draft.length)draft=(d.ordres||[]).slice();render()})));
    if(role==="mj")subPriv();render()});
  let draftTour=0;
  /* ---- tracé sur la carte ---- */
  function poly(keys){return keys.map(P).filter(Boolean)}
  function draw(){
    if(!map.layer.isConnected)return;const k=map.z.px?map.z.px():0.3,u=1/Math.max(k,0.05),L=[];
    const show=c=>c!=="police"||isMJ()||(pub&&!pub.cacher&&pub.cars.police);
    if(pub&&pub.last&&pub.last.paths&&!anim)CARS.forEach(c=>{const pts=show(c)&&pub.last.paths[c]?poly(pub.last.paths[c]):[];
      if(pts.length>1)L.push(`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${V[c].col}" stroke-opacity=".45" stroke-width="${7*u}" stroke-linejoin="round" stroke-linecap="round"/>`)});
    const mc=myCar(),me=mc&&carOf(mc);
    if(me&&draft.length){const r=M.course(me.n,me.f,draft),pts=poly(r.path);
      if(pts.length>1)L.push(`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#fff" stroke-width="${4*u}" stroke-dasharray="${10*u} ${7*u}" stroke-linejoin="round"/>`);
      r.pos.slice(1).forEach((q,i)=>{const p=P(q);if(p)L.push(`<circle cx="${p[0]}" cy="${p[1]}" r="${7*u}" fill="#000" stroke="#fff" stroke-width="${2*u}"/><text x="${p[0]}" y="${p[1]}" dy="${3.5*u}" font-size="${10*u}" text-anchor="middle" fill="#fff" font-family="monospace" font-weight="bold">${i+1}</text>`)})}
    CARS.forEach(c=>{if(!show(c))return;const car=carOf(c);if(!car)return;let p=P(car.n),f=P(car.f);
      if(anim&&anim.pos[c]){p=anim.pos[c].p;f=anim.pos[c].f}if(!p)return;
      let dx=1,dy=0;if(f){dx=p[0]-f[0];dy=p[1]-f[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l}
      const r=13*u,a=[p[0]+dx*r*2.1,p[1]+dy*r*2.1],b=[p[0]+dx*r*1.1-dy*r*.8,p[1]+dy*r*1.1+dx*r*.8],d=[p[0]+dx*r*1.1+dy*r*.8,p[1]+dy*r*1.1-dx*r*.8];
      const lab=c==="police"?"P":c.toUpperCase();
      L.push(`<g${placing===c?' class="tk-blink"':""}><polygon points="${[a,b,d].map(q=>q.join(",")).join(" ")}" fill="${V[c].col}" stroke="#000" stroke-width="${2*u}"/><circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${V[c].col}" stroke="#000" stroke-width="${3*u}"/>${c==="police"?`<circle cx="${p[0]}" cy="${p[1]}" r="${r*1.45}" fill="none" stroke="#ff2a3d" stroke-width="${3*u}" stroke-dasharray="${5*u} ${4*u}"/>`:""}<text x="${p[0]}" y="${p[1]}" dy="${4.5*u}" font-size="${13*u}" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#000">${lab}</text></g>`)});
    map.layer.innerHTML=L.join("")}
  function startAnim(paths){const T0=performance.now(),D=2200,ln={};
    CARS.forEach(c=>{const pts=paths&&paths[c]?poly(paths[c]):[];if(pts.length<2)return;const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));ln[c]={pts,cum}});
    anim={pos:{}};const tick=now=>{if(!alive())return;const t=Math.min(1,(now-T0)/D),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      Object.entries(ln).forEach(([c,{pts,cum}])=>{const s=e*cum[cum.length-1];let i=1;while(i<cum.length-1&&cum[i]<s)i++;const tt=(s-cum[i-1])/((cum[i]-cum[i-1])||1);
        anim.pos[c]={p:[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*tt,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*tt],f:pts[i-1]}});
      draw();if(t<1)requestAnimationFrame(tick);else{anim=null;draw()}};requestAnimationFrame(tick)}
  /* ---- toucher la carte : placement (MJ) ou nom du carrefour ---- */
  function onTap(p,scr){
    const n=M.nearestInter(p,60/Math.max(map.z.px(),0.05));
    if(placing&&isMJ()){if(!n){msg="░ TOUCHER PLUS PRÈS D'UN CARREFOUR";render();return}
      const c=placing;placing=null;setCar(c,{n:n.k,f:[...n.adj.keys()][0]});return}
    if(n)map.showTip(`<b>▓ CARREFOUR</b>${esc(nm(n.k))}`,scr)}
  async function setCar(c,car){busy=true;try{
      if(c==="police"){await putPriv({...priv,police:car});if(!pub.cacher)await putPub({...pub,cars:{...pub.cars,police:car}})}
      else await putPub({...pub,cars:{...pub.cars,[c]:car}});msg="▓ POSITION ENREGISTRÉE : "+nm(car.n)}catch(e){fail(e)}busy=false;render()}
  /* ---- envoi des ordres ---- */
  async function sendOrders(){const c=myCar();if(!c||!pub)return;busy=true;render();
    try{if(c==="police"){await putPriv({...priv,ordres:draft.slice(),tour:pub.tour});await putPub({...pub,policeOk:pub.tour})}
      else await SYNC.put("traque",ID+"-"+c,{ordres:draft.slice(),tour:pub.tour,maj:Date.now()});
      msg="▓ ORDRES ENVOYÉS — MODIFIABLES JUSQU'À LA RÉSOLUTION"}catch(e){fail(e)}busy=false;render()}
  /* ---- résolution du tour (MJ) ---- */
  async function resolve(){if(!pub||!priv)return;busy=true;render();
    const O={t1:ready("t1")?ord.t1.ordres:[],t2:ready("t2")?ord.t2.ordres:[],police:priv.tour===pub.tour?priv.ordres:[]};
    const st={t1:pub.cars.t1,t2:pub.cars.t2,police:priv.police},R={};CARS.forEach(c=>R[c]=M.course(st[c].n,st[c].f,(O[c]||[]).slice(0,vmaxOf(c))));
    const at=(r,i)=>r.pos[Math.min(i,r.pos.length-1)],log=[],T=pub.tour,hide=!!pub.cacher;
    ["t1","t2"].forEach(c=>{const r=R[c],o=O[c]||[];
      log.push({t:T,txt:`${V[c].nom} : ${o.length?o.map(x=>ICON[x]).join(" ")+" → "+nm(r.n):"aucun ordre, reste sur place"}${r.notes.length?" ("+r.notes.join(", ")+")":""}`})});
    if(!hide)log.push({t:T,txt:`${V.police.nom} → ${nm(R.police.n)}`});else log.push({t:T,txt:`${V.police.nom} : position inconnue`});
    ["t1","t2"].forEach(c=>{const a=R[c],b=R.police,m=Math.max(a.pos.length,b.pos.length);
      for(let i=0;i<m;i++){if(at(a,i)===at(b,i)){log.push({t:T,txt:`⚠ CONTACT : ${V[c].nom} intercepte la police — ${nm(at(a,i))}`});break}
        if(i&&at(a,i)===at(b,i-1)&&at(a,i-1)===at(b,i)){log.push({t:T,txt:`⚠ FACE-À-FACE : ${V[c].nom} croise la police — ${nm(at(a,i))}`});break}}});
    const cars={t1:{n:R.t1.n,f:R.t1.f},t2:{n:R.t2.n,f:R.t2.f},police:hide?null:{n:R.police.n,f:R.police.f}};
    const paths={t1:R.t1.path,t2:R.t2.path};if(!hide)paths.police=R.police.path;
    try{await putPriv({...priv,police:{n:R.police.n,f:R.police.f},ordres:[],tour:T});
      await putPub({...pub,tour:T+1,cars,policeOk:0,last:{tour:T+1,paths},log:[...log.reverse(),...(pub.log||[])].slice(0,80)});msg="▓ TOUR "+T+" RÉSOLU"}catch(e){fail(e)}
    busy=false;render()}
  /* ---- panneau ---- */
  function render(){
    if(!side.isConnected)return;
    if(!pub){side.innerHTML=SYNC.kind?`<p>${isMJ()?"CRÉATION DE LA TRAQUE…":"EN ATTENTE DU MJ : la traque démarre quand le MJ ouvre l'application."}</p>${roleHTML()}`:`<p class="warn"><small>MODE LOCAL : stockage partagé indisponible, la traque n'existe que sur cet appareil.</small></p>${isMJ()?"":"<p>EN ATTENTE DU MJ.</p>"}${roleHTML()}`;bindRole();
      if(!SYNC.kind&&isMJ()&&!busy){busy=true;const D=defaults();putPriv(D.priv).then(()=>putPub(D.pub)).finally(()=>busy=false)}return}
    const mj=isMJ()&&role==="mj",c=myCar(),car=c&&carOf(c),vm=c?vmaxOf(c):0;
    const chip=k=>`<span class="tk-chip${ready(k)?" ok":""}" style="--k:${V[k].col}">${k==="police"?"P":k.toUpperCase()} ${ready(k)?"✓":"…"}</span>`;
    let h=`<div class="tk-tour">TOUR ${pub.tour} ${CARS.map(chip).join("")}</div>`;
    if(!SYNC.kind)h+=`<p class="warn"><small>MODE LOCAL : la traque n'est pas partagée entre appareils.</small></p>`;
    h+=roleHTML();
    if(c&&car){
      h+=`<div class="tk-box"><div><b style="color:${V[c].col}">▓ ORDRES — ${esc(V[c].nom)}</b>${c==="police"?" <small>(secrets)</small>":""}</div>
        <small>POSITION : ${esc(nm(car.n))}</small>
        <div class="tk-keys">${["L","S","R","U"].map(x=>`<button data-k="${x}" ${draft.length>=vm?"disabled":""}>${ICON[x]}<br><small>${LIB[x]}</small></button>`).join("")}</div>
        <div class="tk-seq">${draft.map((x,i)=>`<button data-rm="${i}" title="Retirer">${i+1}. ${ICON[x]} ✕</button>`).join("")||"<small>AUCUN ORDRE = LE VÉHICULE RESTE SUR PLACE</small>"}</div>
        <small>${draft.length}/${vm} CARREFOURS${draft.length?" · ARRIVÉE PRÉVUE : "+esc(nm(M.course(car.n,car.f,draft).n)):""}</small>
        <div class="row"><button data-a="clear">EFFACER</button><button data-a="send" ${busy?"disabled":""}>✔ VALIDER LES ORDRES</button></div>
        ${ready(c)?`<small>▓ ORDRES DU TOUR ${pub.tour} ENREGISTRÉS</small>`:""}</div>`}
    else if(c==="police"&&!priv)h+=`<p><small>CHARGEMENT DES DONNÉES MJ…</small></p>`;
    else if(role!=="mj")h+=`<p><small>Choisissez votre véhicule ci-dessus.</small></p>`;
    if(mj&&priv){
      h+=`<div class="tk-box"><b>▓ CONTRÔLE MJ</b><small>Ordres des traqueurs : masqués jusqu'à la résolution.</small>
        ${CARS.map(k=>{const cr=carOf(k);const d=k!=="police"&&cr&&priv.police?M.hops(cr.n,priv.police.n):null;return `<div class="tk-car"><span style="color:${V[k].col}">■ ${esc(V[k].nom)}</span>
          <small>${cr?esc(nm(cr.n)):"—"}${d!==null&&d!==Infinity?` · ${d} carrefour(s) de la police`:""}</small>
          <span class="tk-ctl"><button data-v="${k}" data-d="-1">−</button><b>${vmaxOf(k)}</b><button data-v="${k}" data-d="1">+</button>
          <button data-place="${k}" class="${placing===k?"on":""}">📍</button><button data-rot="${k}" title="Changer l'orientation">↻</button></span></div>`}).join("")}
        <small>− / + : carrefours max par tour · 📍 puis toucher la carte · ↻ orientation</small>
        <label class="tk-chk"><input type="checkbox" data-a="hide" ${pub.cacher?"checked":""}> Cacher la police aux joueurs</label>
        <div class="row"><button data-a="resolve" class="tk-go" ${busy?"disabled":""}>▶ RÉSOLUTION DU TOUR ${pub.tour}</button></div>
        <div class="row"><button data-a="reset">↺ NOUVELLE TRAQUE</button></div></div>`}
    h+=`<div class="msg">${esc(msg)}</div><div class="tk-log"><b>▓ JOURNAL</b>${(pub.log||[]).map(l=>`<div><small>T${l.t}</small> ${esc(l.txt)}</div>`).join("")}</div>`;
    side.innerHTML=h;bindRole();
    side.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{if(draft.length<vm){draft.push(b.dataset.k);draw();render()}});
    side.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.rm,1);draw();render()});
    const A=a=>side.querySelector(`[data-a="${a}"]`);
    A("clear")&&(A("clear").onclick=()=>{draft=[];draw();render()});A("send")&&(A("send").onclick=sendOrders);
    if(mj&&priv){
      side.querySelectorAll("[data-v]").forEach(b=>b.onclick=async()=>{const k=b.dataset.v,v=Math.max(0,Math.min(8,vmaxOf(k)+ +b.dataset.d));
        try{if(k==="police")await putPriv({...priv,vmax:v});else await putPub({...pub,vmax:{...pub.vmax,[k]:v}})}catch(e){fail(e)}});
      side.querySelectorAll("[data-place]").forEach(b=>b.onclick=()=>{placing=placing===b.dataset.place?null:b.dataset.place;msg=placing?"TOUCHEZ LA CARTE À L'ENDROIT VOULU":"";draw();render()});
      side.querySelectorAll("[data-rot]").forEach(b=>b.onclick=()=>{const k=b.dataset.rot,cr=carOf(k);if(!cr)return;const ks=[...M.buildGraph().N[cr.n].adj.keys()];setCar(k,{n:cr.n,f:ks[(ks.indexOf(cr.f)+1)%ks.length]})});
      A("hide").onchange=async e=>{const v=e.target.checked;try{await putPub({...pub,cacher:v,cars:{...pub.cars,police:v?null:priv.police}})}catch(er){fail(er)}};
      A("resolve").onclick=resolve;
      let armed=false;A("reset").onclick=async e=>{if(!armed){armed=true;e.target.textContent="CONFIRMER : TOUT REMETTRE À ZÉRO ?";return}
        const D=defaults();try{await putPriv(D.priv);await putPub(D.pub);await SYNC.put("traque",ID+"-t1",{ordres:[],tour:0});await SYNC.put("traque",ID+"-t2",{ordres:[],tour:0})}catch(er){fail(er)}}}}
  function roleHTML(){return `<div class="tk-role">JE JOUE : ${["t1","t2","mj"].map(r=>`<button data-role="${r}" class="${role===r?"on":""}">${r==="mj"?"MJ (POLICE)":esc(V[r].nom)}</button>`).join("")}</div>
    ${role==="mj"&&!isMJ()?(SYNC.kind?`<p class="warn"><small>${SYNC.kind==="firebase"?"CONNECTEZ-VOUS COMME MJ DANS L'ONGLET ⚿ ACCÈS MJ DE L'ACCUEIL.":"SEUL LE PROPRIÉTAIRE DE LA PAGE PEUT ÊTRE MJ."}</small></p>`
      :`<div class="row"><input id="tk-mj" type="password" placeholder="CODE MJ"><button id="tk-mjok">OK</button></div>`):""}`}
  function bindRole(){side.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{role=b.dataset.role;try{localStorage.setItem(RK,role)}catch(e){}draft=[];placing=null;msg="";
      if(role!=="mj"&&ord[role]&&pub&&ord[role].tour===pub.tour)draft=(ord[role].ordres||[]).slice();if(role==="mj")subPriv();draw();render()});
    const ok=$("#tk-mjok",side);if(ok){const go=()=>{if($("#tk-mj",side).value.trim().toUpperCase()==="MJ"){localMJ=true;subPriv();render()}};ok.onclick=go;$("#tk-mj",side).onkeydown=e=>{if(e.key==="Enter")go()}}}
};

/* ============ APP : ARCHITECTURE NET (strates + nœuds) ============ */
RUN.net=(root,app,ctx)=>{
  const K="net:"+app.id,
  LB={password:"MOT DE PASSE",cameras:"NŒUD DE CONTRÔLE",tourelles:"NŒUD DE CONTRÔLE",blackice:"PROGRAMME BLACK ICE",fichier:"FICHIER",paydata:"FICHIER PAYDATA"},
  fresh=()=>({max:1,cracked:{},revealed:{},won:{},tourelles:true});
  let st=Object.assign(fresh(),ST.get(K));
  const keep=()=>ST.set(K,st),
  opened=nd=>!!ST.get("files")[fid(app,nd.f)],
  camApp=nd=>ctx.s.apps.find(a=>a.id===nd.cams),
  unlockCam=c=>{if(!c)return;const u=ST.get("unl");if(!u[c.id]){u[c.id]=1;ST.set("unl",u)}},
  close=()=>{ovLock=false;ov.classList.remove("show")},
  FERMER=["FERMER"],
  T=(on,t)=>`<span class="nt-tag ${on?"on":"off"}">${t}</span>`;
  function modal(html,btns,lock){
    ovLock=!!lock;
    ov.innerHTML=`<div class="panel">${html}<div class="row"></div></div>`;
    const r=$(".row",ov);
    btns.forEach(([l,fn])=>{const b=document.createElement("button");b.textContent=l;b.onclick=fn||close;r.append(b)});
    ov.classList.add("show")}
  function tag(nd){
    if(nd.type==="password"||nd.type==="cameras")return st.cracked[nd.id]?T(1,"ACCÈS OBTENU"):T(0,"VERROUILLÉ");
    if(nd.type==="blackice")return st.won[nd.id]?T(1,"NEUTRALISÉE"):T(0,"HOSTILE");
    if(nd.type==="tourelles")return !st.cracked[nd.id]?T(0,"VERROUILLÉ"):st.tourelles?T(0,"ACTIVÉ"):T(1,"DÉSACTIVÉ");
    return ""}
  root.innerHTML=`<div class="nt-head"><h2>${esc(app.nom)}</h2><button class="nt-rs">↻ RÉINITIALISER</button></div><div class="nt-body"></div>`;
  const B=$(".nt-body",root);
  function render(){
    B.innerHTML=app.strates.map((s,i)=>i+1>st.max?"":`<section class="nt-strate"><h3>&gt; ${esc(s.nom)}</h3><div class="nt-nodes">${s.nodes.map(nd=>{
      if(!st.revealed[nd.id])return `<button class="nt-node" data-n="${nd.id}"><span>[ ??? ] Donnée non identifiée<small>Cliquer pour analyser</small></span></button>`;
      const done=st.cracked[nd.id]||st.won[nd.id]||(nd.f!==undefined&&opened(nd));
      return `<button class="nt-node${done?" done":""}" data-n="${nd.id}"><span>[${LB[nd.type]}] ${esc(nd.nom)}${nd.diff?`<small>Difficulté : ${esc(nd.diff)}</small>`:""}</span>${tag(nd)}</button>`}).join("")}</div></section>`).join("")
      +(st.max<app.strates.length?`<div class="nt-locked">&gt; STRATE ${st.max+1} : ACCÈS VERROUILLÉ</div>`:"")}
  function openNode(nd){
    if(!st.revealed[nd.id]){st.revealed[nd.id]=true;keep();render()}
    const head=`<h3>[${LB[nd.type]}] ${esc(nd.nom)}</h3>${nd.diff?`<p>Difficulté : ${esc(nd.diff)}</p>`:""}`,ok=st.cracked[nd.id];
    switch(nd.type){
    case "password":
      if(ok)return modal(head+"<p>Accès déjà obtenu.</p>",[FERMER]);
      return modal(head+`<p>Le mot de passe protège l’accès à la strate ${nd.ouvre}.</p>`,[["JET RÉUSSI (1 ACTION)",()=>{
        st.cracked[nd.id]=true;st.max=Math.max(st.max,nd.ouvre);keep();render();
        modal(`<h3>&gt; ACCÈS OBTENU</h3><p>La strate ${nd.ouvre} est maintenant accessible.</p>`,[FERMER])}],FERMER]);
    case "cameras":case "tourelles":
      if(!ok)return modal(head+"<p>Le nœud de contrôle est verrouillé.</p>",[["JET RÉUSSI (1 ACTION)",()=>{st.cracked[nd.id]=true;keep();render();openNode(nd)}],FERMER]);
      if(nd.type==="cameras"){
        const c=camApp(nd);unlockCam(c);
        if(!c)return modal(head+"<p>Accès au nœud obtenu.</p>",[FERMER]);
        return modal(head+`<p>Accès au nœud obtenu. Flux de surveillance disponible.</p><p>CODE D’ACCÈS : <span class="hl">${esc(c.code)}</span></p><p><small>Application « ${esc(c.nom)} » déverrouillée.</small></p>`,
          [["▶ ACCÉDER AUX CAMÉRAS (1 ACTION)",()=>{close();ctx.split(c)}],FERMER])}
      return modal(head+`<p>Accès au nœud obtenu. État : <b class="${st.tourelles?"warn":""}">${st.tourelles?"ACTIVÉ":"DÉSACTIVÉ"}</b></p>`,
        [[`${st.tourelles?"DÉSACTIVER":"ACTIVER"} LES TOURELLES (1 ACTION)`,()=>{st.tourelles=!st.tourelles;keep();render();openNode(nd)}],FERMER]);
    case "blackice":
      if(st.won[nd.id])return modal(head+`<p>Glace <b>${esc(nd.nomIA)}</b> neutralisée.</p>`,[FERMER]);
      return modal(head+`<img class="nt-img" src="${esc(nd.image)}" alt="${esc(nd.nomIA)}" onerror="this.remove()"><p>Nom de Glace : <b>${esc(nd.nomIA)}</b> - ${esc(nd.stats)}</p><p class="warn">Combat en cours : impossible de quitter sans choisir.</p>`,
        [["FUIR (1 ACTION)",close],["VICTOIRE",()=>{st.won[nd.id]=true;keep();render();close()}]],true);
    default:
      if(opened(nd))return openFiles(app,[nd.f],[]);
      return modal(head+"<p>Fichier verrouillé : il faut l’analyser pour le lire.</p>",[["ANALYSER (1 ACTION)",()=>{reveal(app,[nd.f]);render()}],FERMER])}}
  root.onclick=e=>{
    if(e.target.closest(".nt-rs")){st=fresh();keep();render();return}
    const b=e.target.closest("[data-n]");if(b)openNode(app.strates.flatMap(s=>s.nodes).find(n=>n.id===b.dataset.n))};
  render()};

route();
</script>

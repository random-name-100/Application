const SESSIONS=[
{id:1,titre:"Carnage à la Calavera",resume:"La brute, des flingues et Juan",
 /* histoire = texte de l'onglet RÉSUMÉ (paragraphes séparés par une ligne vide, _texte_ = italique) */
 histoire:`Dans l'ombre suffocante d'un bâtiment désaffecté du sud-est du centre-ville, la justice de Night City prend une tournure brutale sous les mains d'Adam, le justicier, et de Glitch, le netrunner. Les deux flics n'hésitent pas à torturer un membre du gang des Metal Head, attaché nu sur une chaise poisseuse, pour lui extorquer la position de son boss, le redoutable Rancor. Crachant le morceau dans la douleur, le gangster avoue que sa cible se dirige vers le bar de la Calavera, situé dans le quartier malfamé de l'Oruga. Loin d'en avoir fini avec leur prisonnier, les deux agents le ligotent solidement avec une corde et le traînent sans ménagement dans leur sillage vers le bar.

Pendant ce temps, l'atmosphère est toute autre à l'intérieur de la Calavera où Choura, le techie, et Shiro, le medtech, s'imprègnent de l'ambiance du quartier de l'Oruga. Leur objectif est d'entrer en contact avec le fixer Saul pour décrocher un contrat crucial : récupérer du matériel de survie destiné aux quartiers de banlieue surpeuplés du sud-est. Après quelques mots échangés avec Juan, le barman et compagnon intime de Saul, les affaires sérieuses commencent enfin avec le fixer pour négocier un partenariat lucratif.

Les tractations tournent court lorsque l'imposant Rancor et trois de ses sbires font irruption dans l'établissement, déclenchant instantanément une violente rixe générale. D'abord acculés par la puissance de feu du gang, Choura, Shiro et Saul voient la situation basculer in extremis avec l'irruption fracassante d'Adam et Glitch qui exécutent froidement deux des hommes de main. Le chaos s'empare de la pièce, et dans la pluie de balles, Saul s'effondre, gravement touché à l'abdomen avec un poumon affaissé. Le combat atteint son paroxysme de brutalité contre le colosse Rancor, qui finit par s'effondrer, criblé de coups et achevé dans un tumulte assourdissant de cris, de poussière et de fumées âcres de grenades.

Alors que le silence retombe pesamment sur le bar dévasté et que Shiro se précipite pour stabiliser les blessures critiques de Saul, une terrible réalité s'impose au reste du groupe. Profitant de la confusion totale de l'affrontement pyrotechnique, le prisonnier des Metal Head a réussi à faire glisser sa corde et s'est volatilisé dans les rues sombres de Night City, non sans avoir arraché et kidnappé Juan au passage.`,
 apps:[]},
{id:2,titre:"Sang, Sueur et Ombres Corporatistes",resume:"La traque, la baston et la planque",
 histoire:`Tandis que Shiro parvient à stabiliser in extremis les blessures critiques de Saul dans les décombres de la Calavera, l'enquête reprend sans attendre pour retrouver Juan et son ravisseur. En interrogeant le central, Adam identifie le _Slammer_, un rade malfamé qui compte les Metal Heads comme habitués. Sur place, le groupe déniche un moyen d'obtenir des renseignements cruciaux : infiltrer une arnaque aux paris clandestins lors d'un tournoi de combat à mains nues. Envoyé dans l'arène, Choura traverse les deux premiers rounds truqués avec aisance, avant d'affronter une finale brutale et bien réelle. Le techie devient insaisissable, esquivant chaque tentative de projection de son adversaire pour finalement le briser grâce à des contres chirurgicaux. Le groupe rafle l'argent des paris et localise trois planques du gang : l'usine Alpha de Watson, la clinique Beta de Pacifica, et le hangar Gamma sur les docks.

Ciblant le point de transfert, l'équipe débarque devant un complexe délabré, vestige d'un centre de traitement des eaux ceinturé de grillages défoncés et crachant un fluide verdâtre dans la marina. Délaissant le toit lourdement défendu par des tourelles, ils s'infiltrent silencieusement par une porte de garage éventrée. À l'intérieur, Glitch se connecte au réseau local, aveugle les caméras et désamorce les défenses pour guider ses partenaires. Progressant sans éveiller les soupçons, ils atteignent l'étage supérieur, neutralisent le netrunner ennemi distrait par sa réalité virtuelle, et mettent à sac l'armurerie de feu Rancor. C'est là qu'ils retrouvent et assomment sauvagement le ravisseur de Juan, savourant leur vengeance.

L'accès au sous-sol enfin déverrouillé, l'escouade plonge dans l'abîme. Ils libèrent Juan en interrompant sa séance de torture et survivent par miracle à l'embuscade toxique d'un chimiste du gang grâce à des réflexes surhumains. L'horreur les attend plus loin : une immense cage remplie de cobayes humains malingres. La découverte glaçante du cadavre d'un enfant ébranle profondément l'humanité de deux membres du groupe. En fouillant les données numériques du repaire, l'ampleur de l'opération se dévoile : un trafic d'êtres humains massivement financé par l'obscure _BY Corp_. Le choc devient intime lorsque Choura découvre que sa propre sœur, Lisa Fiodorovitch Ouvarov, a été expédiée via ce réseau sur commande spéciale. L'intervention s'achève dans le vacarme des gyrophares lorsque le sauvetage d'un corpo captif déclenche sa puce d'alerte, attirant instantanément la Trauma Team et le NCPD qui sécurisent le périmètre et démantèlent ce qu'il reste des Metal Heads.`,

RUN.cam=(root,app)=>{

  const cv=$("canvas",root),x=cv.getContext("2d"),v=document.createElement("video"),M=$(".msg",root),C="#00ff9c";
  v.muted=true;v.playsInline=true;
  let live=false,mode=0,t=0,stream,msg="SIGNAL ABSENT — ACTIVER LA CAMÉRA";
  const modes=["NORMAL","NOCTURNE","ANALYSE"],fl=["grayscale(1) contrast(1.3)","grayscale(1) brightness(2) contrast(1.4)","grayscale(1) contrast(2.2) invert(1)"],
  tg=[...Array(3)].map(()=>({x:R(500),y:R(300),vx:Math.random()*2-1,vy:Math.random()*2-1,id:10+R(90),p:55+R(40)}));
  root.onclick=e=>{const b=e.target.closest("button"),a=b?.dataset.a;if(!a)return;
    if(a==="on")navigator.mediaDevices?.getUserMedia({video:{facingMode:"environment"}}).then(s=>{stream=s;v.srcObject=s;v.play();live=true}).catch(()=>{msg="ACCÈS CAMÉRA REFUSÉ — MODE SIMULATION"});
    if(a==="mode"){mode=(mode+1)%3;$("b",b).textContent=modes[mode]}
    if(a==="snap"){const h=app.files.findIndex(f=>f.mode===mode);
      if(h<0)M.textContent="CAPTURE ENREGISTRÉE — AUCUNE DONNÉE EXPLOITABLE";else{M.textContent="▓ DONNÉE EXTRAITE";reveal(app,[h])}}};
  function br(px,py,sx,sy,l){x.beginPath();x.moveTo(px,py+sy*l);x.lineTo(px,py);x.lineTo(px+sx*l,py);x.stroke()}
  (function f(){
    if(!root.isConnected){stream&&stream.getTracks().forEach(k=>k.stop());return}
    t++;x.globalCompositeOperation="source-over";
    if(live&&v.videoWidth){x.filter=fl[mode];x.drawImage(v,0,0,640,400);x.filter="none";x.globalCompositeOperation="multiply";x.fillStyle="#5dffb4";x.fillRect(0,0,640,400);x.globalCompositeOperation="source-over"}
    else{x.fillStyle="#000";x.fillRect(0,0,640,400);x.fillStyle=C;for(let i=0;i<260;i++){x.globalAlpha=Math.random()*.45;x.fillRect(R(640),R(400),R(40)+2,2)}
      x.globalAlpha=1;x.font="16px monospace";x.textAlign="center";x.fillText(msg,320,205);x.textAlign="left"}
    x.strokeStyle=x.fillStyle=C;x.lineWidth=2;x.font="13px monospace";
    br(14,14,1,1,34);br(626,14,-1,1,34);br(14,386,1,-1,34);br(626,386,-1,-1,34);
    x.beginPath();x.arc(320,200,42,0,7);x.moveTo(320,140);x.lineTo(320,170);x.moveTo(320,230);x.lineTo(320,260);x.moveTo(260,200);x.lineTo(290,200);x.moveTo(350,200);x.lineTo(380,200);x.stroke();
    if(mode===2)tg.forEach(g=>{g.x+=g.vx;g.y+=g.vy;if(g.x<30||g.x>520)g.vx*=-1;if(g.y<40||g.y>290)g.vy*=-1;x.strokeRect(g.x,g.y,70,90);x.fillText(`CIBLE ${g.id} · ${g.p}%`,g.x,g.y-5)});
    if(live&&t%60<38)x.fillText("● REC",34,34);else if(!live)x.fillText("○ STBY",34,34);
    x.textAlign="right";x.fillText(new Date().toLocaleTimeString("fr-FR"),606,34);x.textAlign="left";
    x.fillText(`${app.tag} · ${modes[mode]}`,34,376);
    x.globalAlpha=.14;x.fillRect(0,(t*3)%400,640,4);x.globalAlpha=1;requestAnimationFrame(f)})()};

/* ============ APP : BREACH PROTOCOL ============ */
RUN.breach=(root,app)=>{
  root.innerHTML=`<h2>${esc(app.nom)}</h2><div class="hh"><div class="grid"></div><div><div>TAMPON</div><div class="slots"></div><div>FICHIERS CHIFFRÉS</div><div class="seqs"></div><div class="msg"></div><div class="row"><button class="rs">↻ RECOMMENCER</button></div></div></div>`;
  const N=5,H=["1C","55","BD","E9","7A","FF"],G=$(".grid",root);
  let g,seqs,buf,step,last,used,t,iv,over;
  const has=s=>buf.some((_,i)=>s.every((h,j)=>buf[i+j]===h));
  function end(){over=true;clearInterval(iv)}
  function start(){
    clearInterval(iv);g=Array.from({length:N},()=>Array.from({length:N},()=>H[R(6)]));
    let r=0,c=R(N),p=[[r,c]];
    for(let i=1;i<5;i++){let n;if(i%2){do n=R(N);while(p.some(q=>q[0]===n&&q[1]===c));r=n}else{do n=R(N);while(p.some(q=>q[0]===r&&q[1]===n));c=n}p.push([r,c])}
    const cd=p.map(q=>g[q[0]][q[1]]);
    seqs=[{s:cd.slice(0,3),ok:false},{s:cd.slice(1,5),ok:false}];
    buf=[];step=0;last=[0,0];used=new Set();t=app.time||30;over=false;
    iv=setInterval(()=>{if(!root.isConnected){clearInterval(iv);return}if(!over&&--t<=0)end();draw()},1000);draw()}
  const can=(r,c)=>!over&&!used.has(r+","+c)&&(step%2?c===last[1]:r===last[0]);
  G.onclick=e=>{const b=e.target.closest("button");if(!b)return;const r=+b.dataset.r,c=+b.dataset.c;if(!can(r,c))return;
    buf.push(g[r][c]);used.add(r+","+c);last=[r,c];step++;
    const done=[];seqs.forEach((q,i)=>{if(!q.ok&&has(q.s)){q.ok=true;done.push(i)}});
    if(buf.length>=6||seqs.every(q=>q.ok))end();draw();if(done.length)reveal(app,done.filter(i=>app.files[i]))};
  function draw(){
    G.innerHTML=g.map((row,r)=>row.map((h,c)=>`<button data-r="${r}" data-c="${c}" class="${used.has(r+","+c)?"used":can(r,c)?"ok":""}">${h}</button>`).join("")).join("");
    $(".slots",root).innerHTML=Array.from({length:6},(_,i)=>`<span>${buf[i]||"··"}</span>`).join("");
    $(".seqs",root).innerHTML=seqs.map((q,i)=>`<div class="seq ${q.ok?"done":""}">${q.s.join(" ")}<br><small>${q.ok&&app.files[i]?esc(app.files[i].titre):"▒▒▒ FICHIER CHIFFRÉ "+(i+1)}</small></div>`).join("");
    const k=seqs.filter(q=>q.ok).length;
    $(".msg",root).textContent=over?(k===2?"▓ BRÈCHE RÉUSSIE":k?"▒ BRÈCHE PARTIELLE":"░ ÉCHEC — ICE ACTIVÉE"):`⏱ ${t}s`}
  $(".rs",root).onclick=start;start()};

/* ============ APP : ARCHITECTURE NET (strates + nœuds) ============ */
RUN.net=(root,app,ctx)=>{
  const K="net:"+app.id,
  LB={password:"MOT DE PASSE",cameras:"NŒUD DE CONTRÔLE",tourelles:"NŒUD DE CONTRÔLE",blackice:"PROGRAMME BLACK ICE",fichier:"FICHIER",paydata:"FICHIER PAYDATA",mail:"MAIL"},
  fresh=()=>({max:1,cracked:{},revealed:{},won:{},tourelles:true,iface:st&&st.iface});
  let st=null;st=Object.assign(fresh(),ST.get(K));
  /* SD d'un nœud : « SD 10 » → 10 ; difficultés nommées → table ci-dessous */
  const DIFF={facile:4,moyen:8,difficile:12},
  sdOf=nd=>{const d=String(nd.diff||""),m=d.match(/SD\s*(\d+)/i);return m?+m[1]:DIFF[d.trim().toLowerCase()]||null};
  const keep=()=>ST.set(K,st),
  opened=nd=>!!ST.get("files")[fid(app,nd.f)],
  camApp=nd=>ctx.s.apps.find(a=>a.id===nd.cams),
  unlockCam=c=>{if(!c)return;const u=ST.get("unl");if(!u[c.id]){u[c.id]=1;ST.set("unl",u)}},
  close=()=>{ovLock=false;ov.classList.remove("show")},

    ov.classList.add("show")}

    if(nd.type==="password"||nd.type==="cameras")return st.cracked[nd.id]?T(1,"ACCÈS OBTENU"):T(0,"VERROUILLÉ");
    if(nd.type==="blackice")return st.won[nd.id]?T(1,"NEUTRALISÉE"):T(0,"HOSTILE");
    if(nd.type==="tourelles")return !st.cracked[nd.id]?T(0,"VERROUILLÉ"):st.tourelles?T(0,"ACTIVÉ"):T(1,"DÉSACTIVÉ");
    return ""}

  const ifIn=$(".nt-ifv",root);ifIn.onchange=()=>{const v=parseInt(ifIn.value,10);st.iface=isNaN(v)?null:Math.max(0,Math.min(20,v));ifIn.value=st.iface??"";keep()};
  /* épreuve de netrunning : 1D10 + INTERFACE ≥ SD → succès (ok) ; sinon « Résultat trop bas, hacking échoué » */
  function epreuve(nd,head,txt,ok){const sd=sdOf(nd);if(!sd)return modal(head+txt,[["JET RÉUSSI (1 ACTION)",ok],FERMER]);
    const ask=()=>modal(head+txt+`<p>Épreuve : <b>1D10 + INTERFACE ≥ SD ${sd}</b></p>
      <div class="row"><label class="nt-if">INTERFACE <input type="number" min="0" max="20" id="nt-ifm" value="${st.iface??""}" placeholder="?"></label></div>`,
      [["🎲 LANCER 1D10 (1 ACTION)",()=>{const v=parseInt($("#nt-ifm").value,10);if(isNaN(v)){$("#nt-ifm").focus();$("#nt-ifm").placeholder="REQUIS";return}
        st.iface=Math.max(0,Math.min(20,v));ifIn.value=st.iface;keep();
        const d=1+Math.floor(Math.random()*10),tot=d+st.iface,win=tot>=sd;
        const res=`<div class="nt-roll ${win?"ok":"ko"}"><span class="nt-die">${d}</span> + INTERFACE ${st.iface} = <b>${tot}</b> ${win?"≥":"<"} SD ${sd}</div>`;
        if(win)modal(head+res+`<p>▓ HACKING RÉUSSI</p>`,[["CONTINUER",ok]]);
        else modal(head+res+`<p class="warn">░ Résultat trop bas, hacking échoué</p>`,[["🎲 RELANCER (1 ACTION)",ask],FERMER])}],FERMER]);
    ask()}
  const B=$(".nt-body",root);
  function render(){
    B.innerHTML=app.strates.map((s,i)=>i+1>st.max?"":`<section class="nt-strate"><h3>&gt; ${esc(s.nom)}</h3><div class="nt-nodes">${s.nodes.map(nd=>{
      if(!st.revealed[nd.id]&&nd.type!=="mail")return `<button class="nt-node" data-n="${nd.id}"><span>[ ??? ] Donnée non identifiée<small>Cliquer pour analyser</small></span></button>`;
      const done=st.cracked[nd.id]||st.won[nd.id]||(nd.f!==undefined&&opened(nd));
      return `<button class="nt-node${done?" done":""}" data-n="${nd.id}"><span>[${LB[nd.type]}] ${esc(nd.nom)}${nd.diff?`<small>Difficulté : ${esc(nd.diff)}</small>`:""}</span>${tag(nd)}</button>`}).join("")}</div></section>`).join("")
      +(st.max<app.strates.length?`<div class="nt-locked">&gt; STRATE ${st.max+1} : ACCÈS VERROUILLÉ</div>`:"")}
  function openNode(nd){

          [["▶ ACCÉDER AUX CAMÉRAS (1 ACTION)",()=>{close();ctx.split(c)}],FERMER])}
      return modal(head+`<p>Accès au nœud obtenu. État : <b class="${st.tourelles?"warn":""}">${st.tourelles?"ACTIVÉ":"DÉSACTIVÉ"}</b></p>`,
        [[`${st.tourelles?"DÉSACTIVER":"ACTIVER"} LES TOURELLES (1 ACTION)`,()=>{st.tourelles=!st.tourelles;keep();render();openNode(nd)}],FERMER]);
    case "blackice":
      if(st.won[nd.id])return modal(head+`<p>Glace <b>${esc(nd.nomIA)}</b> neutralisée.</p>`,[FERMER]);

        [["FUIR (1 ACTION)",close],["VICTOIRE",()=>{st.won[nd.id]=true;keep();render();close()}]],true);
    case "mail":return reveal(app,[nd.f]);
    default:
      if(opened(nd))return openFiles(app,[nd.f],[]);
      return modal(head+"<p>Fichier verrouillé : il faut l’analyser pour le lire.</p>",[["ANALYSER (1 ACTION)",()=>{reveal(app,[nd.f]);render()}],FERMER])}}
  root.onclick=e=>{
    if(e.target.closest(".nt-rs")){st=fresh();keep();render();return}
    const b=e.target.closest("[data-n]");if(b)openNode(app.strates.flatMap(s=>s.nodes).find(n=>n.id===b.dataset.n))};
  render()};

route();
</script>
</body>
